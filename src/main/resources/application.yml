spring:
  application:
    name: notification-service
  config:
    # Shared settings from config-server (fyp-grading-config). Optional: this file is complete on its own.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}/config"
  cloud:
    config:
      fail-fast: false
    function:
      definition: activity;notifications
    stream:
      bindings:
        activity-in-0:
          destination: assay.activity
          group: notification-service
          consumer: {max-attempts: 4, back-off-initial-interval: 500, back-off-multiplier: 2.0}
        notifications-in-0:
          destination: assay.notifications
          group: notification-service
          consumer: {max-attempts: 4, back-off-initial-interval: 500, back-off-multiplier: 2.0}
      rabbit:
        default:
          consumer:
            auto-bind-dlq: true   # each queue gets its own <queue>.dlq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mvc:
    async:
      request-timeout: 31m
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs

server:
  port: ${PORT:8080}
  shutdown: graceful

eureka:
  client:
    # Register and refresh quickly: the services start together and find each other (and the config server) by name.
    initial-instance-info-replication-interval-seconds: 2
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay notification service: personal notifications, activity feed, live stream"
    version: ${BUILD_VERSION:dev}

springdoc:
  # Service-to-service endpoints aren't part of the public API (the gateway doesn't route them).
  paths-to-exclude: /internal/**
